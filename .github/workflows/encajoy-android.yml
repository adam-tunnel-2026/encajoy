name: Encajoy - APK y AAB firmado

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Encajoy-0.6.8-Codigo-Podio.zip'
      - '.github/workflows/encajoy-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar Encajoy 0.6.8
        id: prepare
        run: |
          set -euo pipefail

          ZIP="Encajoy-0.6.8-Codigo-Podio.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::No existe $ZIP"
            exit 1
          fi

          mkdir -p proyecto
          unzip -q "$ZIP" -d proyecto

          python3 - <<'PYTHON'
          import re
          from pathlib import Path

          candidates = list(Path("proyecto").rglob("app/build.gradle"))

          candidates = [
              p for p in candidates
              if (p.parent.parent / "build.gradle").is_file()
          ]

          if len(candidates) != 1:
              raise SystemExit(
                  f"Se esperaba un proyecto Android, encontrados: {len(candidates)}"
              )

          app = candidates[0]
          root = app.parent.parent

          print("Proyecto encontrado:", root)

          root_gradle = root / "build.gradle"
          content = root_gradle.read_text()

          content, count = re.subn(
              r"""(com\.android\.application['"]\s+version\s+['"])[^'"]+(?=['"])""",
              r"\g<1>8.10.1",
              content
          )

          if count != 1:
              raise SystemExit("No se pudo configurar Android Gradle Plugin")

          root_gradle.write_text(content)

          content = app.read_text()

          changes = [
              (r"(\bcompileSdk\s+)\d+\b", r"\g<1>36"),
              (r"(\btargetSdk\s+)\d+\b", r"\g<1>36"),
              (r"(\bversionCode\s+)\d+\b", r"\g<1>33"),
              (
                  r"""(\bversionName\s+['"])[^'"]+(?=['"])""",
                  r"\g<1>0.6.8"
              ),
          ]

          for pattern, replacement in changes:
              content, count = re.subn(
                  pattern,
                  replacement,
                  content
              )

              if count != 1:
                  raise SystemExit(
                      "No se pudo actualizar: " + pattern
                  )

          app.write_text(content)

          Path("encajoy-project-path.txt").write_text(
              str(root.resolve())
          )

          print("Encajoy 0.6.8 preparado")
          print("versionCode: 33")
          print("versionName: 0.6.8")
          PYTHON

          echo "version=0.6.8" >> "$GITHUB_OUTPUT"

      - name: Compilar APK y AAB
        env:
          ENCAJOY_ADMOB_APP_ID: ${{ vars.ENCAJOY_ADMOB_APP_ID }}
        run: |
          set -euo pipefail

          cd "$(cat encajoy-project-path.txt)"

          gradle :app:assembleRelease :app:bundleRelease --no-daemon

          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/bundle/release/app-release.aab

          echo "Compilacion Android completada"

      - name: Firmar APK y AAB con clave permanente
        env:
          KEYSTORE_B64: ${{ secrets.ENCAJOY_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ENCAJOY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ENCAJOY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ENCAJOY_KEY_PASSWORD }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_B64" ||
                -z "$STORE_PASSWORD" ||
                -z "$KEY_ALIAS" ||
                -z "$KEY_PASSWORD" ]]; then
            echo "::error::Faltan secretos de firma"
            exit 1
          fi

          umask 077

          keydir=$(mktemp -d "$RUNNER_TEMP/encajoy.XXXXXX")
          trap 'rm -rf "$keydir"' EXIT

          printf '%s' "$KEYSTORE_B64" |
            base64 --decode > "$keydir/signing.keystore"

          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"

          project_dir="$(cat encajoy-project-path.txt)"

          source_apk="$project_dir/app/build/outputs/apk/release/app-release-unsigned.apk"

          "$sdk_tools/zipalign" -P 16 -f 4 \
            "$source_apk" \
            "$keydir/aligned.apk"

          "$sdk_tools/apksigner" sign \
            --ks "$keydir/signing.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "Encajoy-$VERSION.apk" \
            "$keydir/aligned.apk"

          "$sdk_tools/apksigner" verify \
            --print-certs \
            "Encajoy-$VERSION.apk"

          source_aab="$project_dir/app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -keystore "$keydir/signing.keystore" \
            -storepass:env STORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -signedjar "Encajoy-$VERSION.aab" \
            "$source_aab" \
            "$KEY_ALIAS"

          jarsigner -verify "Encajoy-$VERSION.aab"

          echo "APK y AAB firmados correctamente"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Encajoy-0.6.8-APK
          path: Encajoy-0.6.8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar AAB para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: Encajoy-0.6.8-Google-Play
          path: Encajoy-0.6.8.aab
          if-no-files-found: error
          retention-days: 30
