name: Encajoy - APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Encajoy-0.1.0-Proyecto.zip, .github/workflows/encajoy-android.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar Encajoy
        run: |
          unzip -q Encajoy-0.1.0-Proyecto.zip -d proyecto
          cd proyecto/encajoy
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Encajoy-0.1.0-PRUEBA.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Encajoy-0.1.0-APK
          path: Encajoy-0.1.0-PRUEBA.apk
          if-no-files-found: error
